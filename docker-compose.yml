services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      APP_NAME: ${APP_NAME:-RagTest API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-ragtest_documents}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      SOURCE_DIR: /app/data/source
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_CACHE_DIR: /app/.cache/fastembed
      UPSERT_BATCH_SIZE: ${UPSERT_BATCH_SIZE:-64}
      FASTEMBED_CACHE_PATH: /app/.cache/fastembed
      SPARSE_EMBEDDING_PROVIDER: ${SPARSE_EMBEDDING_PROVIDER:-fastembed_bm25}
      SPARSE_EMBEDDING_MODEL: ${SPARSE_EMBEDDING_MODEL:-Qdrant/bm25}
      SPARSE_EMBEDDING_LANGUAGE: ${SPARSE_EMBEDDING_LANGUAGE:-portuguese}
      HYBRID_DENSE_WEIGHT: ${HYBRID_DENSE_WEIGHT:-1.0}
      HYBRID_SPARSE_WEIGHT: ${HYBRID_SPARSE_WEIGHT:-1.2}
      RETRIEVAL_CANDIDATE_MULTIPLIER: ${RETRIEVAL_CANDIDATE_MULTIPLIER:-8}
      RETRIEVAL_SCORE_MARGIN: ${RETRIEVAL_SCORE_MARGIN:-0.22}
      RETRIEVAL_MERGE_SAME_PAGE: ${RETRIEVAL_MERGE_SAME_PAGE:-true}
      RETRIEVAL_MAX_GROUP_CHARS: ${RETRIEVAL_MAX_GROUP_CHARS:-5000}
      RETRIEVAL_SOURCE_LEXICAL_WEIGHT: ${RETRIEVAL_SOURCE_LEXICAL_WEIGHT:-0.25}
      RETRIEVAL_CONTENT_LEXICAL_WEIGHT: ${RETRIEVAL_CONTENT_LEXICAL_WEIGHT:-0.05}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2400}
      HOME: /home/app
      XDG_CACHE_HOME: /app/.cache
      HF_HOME: /app/.cache/huggingface
      HF_HUB_DISABLE_XET: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./data/source:/app/data/source:ro
      - fastembed_cache:/app/.cache/fastembed
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
  fastembed_cache:

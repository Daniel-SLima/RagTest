services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      APP_NAME: ${APP_NAME:-RagTest API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-5}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data/source:/app/data/source:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:

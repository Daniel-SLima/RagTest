[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtest"
version = "0.5.0"
description = "Backend portável de RAG com FastAPI, Qdrant e Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "fastembed>=0.7,<1.0",
    "fonttools>=4.59,<5.0",
    "google-genai>=1.33,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "pydantic-settings>=2.10,<3.0",
    "pypdf>=6.0,<7.0",
    "python-docx>=1.2,<2.0",
    "qdrant-client>=1.15,<2.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.12,<1.0",
]

[project.scripts]
ragtest-inspect = "app.cli.inspect_documents:main"
ragtest-ingest = "app.cli.ingest:main"
ragtest-search = "app.cli.search:main"
ragtest-chat = "app.cli.chat:main"
ragtest-evaluate-retrieval = "app.cli.evaluate_retrieval:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

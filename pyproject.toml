[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtest"
version = "0.5.19"
description = "Backend portável de RAG com FastAPI, Qdrant, OCR e múltiplos providers de LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "fastembed==0.8.0",
    "fonttools>=4.59,<5.0",
    "google-genai>=1.33,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "pillow>=11,<13",
    "pydantic-settings>=2.10,<3.0",
    "pymupdf>=1.26,<2.0",
    "pypdf>=6.0,<7.0",
    "pytesseract>=0.3.13,<1.0",
    "python-docx>=1.2,<2.0",
    "qdrant-client==1.19.1",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff==0.16.8",
]

[project.scripts]
ragtest-inspect = "app.cli.inspect_documents:main"
ragtest-ingest = "app.cli.ingest:main"
ragtest-search = "app.cli.search:main"
ragtest-chat = "app.cli.chat:main"
ragtest-evaluate-retrieval = "app.cli.evaluate_retrieval:main"
ragtest-check-grounding = "app.cli.check_grounding:main"
ragtest-search-multi = "app.cli.search_multi:main"
ragtest-check-multi-query = "app.cli.check_multi_query:main"
ragtest-check-decomposition = "app.cli.check_decomposition:main"
ragtest-runtime-info = "app.cli.runtime_info:main"
ragtest-plan-ingestion-sync = "app.cli.plan_ingestion_sync:main"
ragtest-sync-ingestion = "app.cli.sync_ingestion:main"
ragtest-check-ingestion-sync = "app.cli.check_ingestion_sync:main"
ragtest-check-ingestion-sync-qdrant = "app.cli.check_ingestion_sync_qdrant:main"
ragtest-audit-docx-structure = "app.cli.audit_docx_structure:main"
ragtest-audit-evaluation-labels = "app.cli.audit_evaluation_labels:main"
ragtest-check-evaluation-v2 = "app.cli.check_evaluation_v2:main"
ragtest-check-grounding-coverage = "app.cli.check_grounding_coverage:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001", "BLE001", "RUF022"]
